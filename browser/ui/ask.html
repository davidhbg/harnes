<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font: 500 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        color: #e4dff0;
      }
      .card {
        position: absolute;
        inset: 8px;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(21, 17, 38, 0.97);
        border: 1px solid #5b4e96;
        box-shadow: 0 12px 30px rgba(10, 5, 25, 0.55);
        animation: in 0.18s ease-out;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #a99bdc;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .head b {
        color: #e3b48f;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid #8676c4;
        background: #0e0b1c;
        color: #e4dff0;
        font: inherit;
        outline: none;
        box-shadow: 0 0 0 3px rgba(134, 118, 196, 0.2);
      }
      .foot {
        margin-top: 6px;
        color: #625b80;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head"><b>◆</b> Was soll ich dir zeigen?</div>
      <input id="q" placeholder="z. B. Wo stelle ich hier die Sprache um?" autofocus />
      <div class="foot">Enter fragen · Esc abbrechen · Ich sehe deinen Bildschirm und zeige auf die Stellen.</div>
    </div>
    <script src="ask.js"></script>
  </body>
</html>
