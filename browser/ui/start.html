<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Startseite</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(1200px 600px at 70% 10%, #241c40 0%, #0e0b1c 55%) fixed, #0e0b1c;
        color: #e4dff0;
        font: 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
      }
      .wrap {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
      }
      h1 {
        margin: 0;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 6px;
        background: linear-gradient(90deg, #8676c4, #c59bc0, #e3b48f);
        -webkit-background-clip: text;
        color: transparent;
      }
      .sub {
        margin-top: -18px;
        color: #625b80;
        letter-spacing: 6px;
        font-size: 12px;
      }
      form {
        width: min(640px, 86vw);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px 6px 18px;
        border-radius: 18px;
        background: rgba(21, 17, 38, 0.9);
        border: 1px solid #3d3562;
        box-shadow: 0 16px 50px rgba(5, 3, 15, 0.6);
      }
      form:focus-within {
        border-color: #8676c4;
        box-shadow: 0 0 0 4px rgba(134, 118, 196, 0.16), 0 16px 50px rgba(5, 3, 15, 0.6);
      }
      input {
        flex: 1;
        height: 42px;
        border: 0;
        outline: none;
        background: none;
        color: #e4dff0;
        font: 16px inherit;
        font-family: inherit;
      }
      input::placeholder {
        color: #625b80;
      }
      button {
        height: 38px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid #5b4e96;
        background: #2a2347;
        color: #e4dff0;
        font: 600 13px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .tiles {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        max-width: 720px;
      }
      .tiles a {
        width: 120px;
        padding: 14px 10px;
        border-radius: 14px;
        text-align: center;
        text-decoration: none;
        color: #938bad;
        background: rgba(21, 17, 38, 0.7);
        border: 1px solid #2a2347;
        transition: border-color 0.15s, color 0.15s, transform 0.15s;
      }
      .tiles a:hover {
        color: #e4dff0;
        border-color: #8676c4;
        transform: translateY(-2px);
      }
      .tiles b {
        display: block;
        font-size: 20px;
        color: #a99bdc;
        margin-bottom: 4px;
      }
      .tip {
        color: #625b80;
        font-size: 12.5px;
      }
      .tip kbd {
        font: 11px 'Cascadia Mono', Consolas, monospace;
        color: #938bad;
        padding: 1px 6px;
        border-radius: 6px;
        border: 1px solid #3d3562;
      }
    </style>
  </head>
  <body>
    <canvas id="sky"></canvas>
    <div class="wrap">
      <h1>HARNES</h1>
      <div class="sub">B R O W S E R</div>
      <form action="https://www.google.com/search" method="get">
        <input name="q" placeholder="Suchen oder Adresse eingeben" autofocus />
        <button>Suchen</button>
      </form>
      <div class="tiles">
        <a href="https://github.com"><b>⌥</b>GitHub</a>
        <a href="https://claude.ai"><b>◆</b>Claude</a>
        <a href="https://chatgpt.com"><b>◎</b>ChatGPT</a>
        <a href="https://www.youtube.com"><b>▶</b>YouTube</a>
        <a href="http://localhost:3000"><b>⌂</b>localhost:3000</a>
      </div>
      <div class="tip">Rechts arbeitet dein Team. Die Sitzungen können diesen Browser bedienen. <kbd>Strg+Alt+H</kbd> – die KI zeigt dir etwas auf dem Bildschirm.</div>
    </div>
    <script>
      // Sternenhimmel mit langsam funkelnden Sternen
      const c = document.getElementById('sky');
      const g = c.getContext('2d');
      let stars = [];
      function size() {
        c.width = innerWidth * devicePixelRatio;
        c.height = innerHeight * devicePixelRatio;
        stars = Array.from({ length: Math.round((innerWidth * innerHeight) / 5000) }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6, s: 0.4 + Math.random() }));
      }
      size();
      addEventListener('resize', size);
      (function draw(t) {
        g.clearRect(0, 0, c.width, c.height);
        for (const s of stars) {
          const a = 0.25 + 0.75 * Math.abs(Math.sin(t / 1800 * s.s + s.p));
          g.fillStyle = `rgba(${s.r > 1.2 ? '244,230,200' : '183,172,223'},${a})`;
          g.beginPath();
          g.arc(s.x, s.y, s.r * devicePixelRatio, 0, 7);
          g.fill();
        }
        requestAnimationFrame(draw);
      })(0);
      // Eingabe sieht wie eine Adresse aus: direkt öffnen statt suchen
      document.querySelector('form').addEventListener('submit', (e) => {
        const v = document.querySelector('input').value.trim();
        if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v) || /^https?:\/\//.test(v)) {
          e.preventDefault();
          location.href = /^https?:\/\//.test(v) ? v : 'https://' + v;
        }
      });
    </script>
  </body>
</html>
