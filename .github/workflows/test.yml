# Prüft Harnes bei jedem Push auf Linux, macOS und Windows:
# bauen, alle Tests, dann das Installationspaket wirklich installieren und starten.
name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm ci
      - name: Bauen
        run: npm run build
      - name: Tests
        run: npm test
        env:
          # Ink zeichnet bei CI=true nur das letzte Bild; die Tests bedienen die Oberfläche wie ein Mensch
          CI: 'false'
      - name: Paket bauen
        shell: bash
        run: npm pack && mv harnes-*.tgz harnes-test.tgz
      - name: Installer ausführen (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          HARNES_PAKET: ${{ github.workspace }}/harnes-test.tgz
        run: bash installer/install.sh
      - name: Installer ausführen (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          HARNES_PAKET: ${{ github.workspace }}\harnes-test.tgz
        run: iex (Get-Content -Raw installer/install.ps1)
      - name: Harnes starten
        shell: bash
        run: |
          harnes --version
          harnes --hilfe | head -5
      - name: Deinstallieren
        shell: bash
        run: |
          # Unter Windows hält der Virenscanner frisch installierte Dateien manchmal kurz fest (EBUSY)
          for i in 1 2 3 4 5; do npm uninstall -g harnes && break; echo "noch belegt, neuer Versuch"; sleep 10; done
          if command -v harnes; then echo "harnes ist noch da"; exit 1; fi
          echo "sauber entfernt"
